<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fleet Tracker &mdash; Control de Flota</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <h1>Fleet Tracker</h1>
      </div>
      <div class="topbar-stats" id="topbarStats">
        <div class="stat"><span class="stat-value" id="statActive">0</span><span class="stat-label">Activos</span></div>
        <div class="stat"><span class="stat-value" id="statOffline">0</span><span class="stat-label">Sin señal</span></div>
        <div class="stat"><span class="stat-value" id="statAlerts">0</span><span class="stat-label">Alertas</span></div>
      </div>
      <div class="conn-status" id="connStatus">Conectando…</div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <section class="panel">
          <div class="panel-header">
            <h2>Vehículos</h2>
            <button class="btn btn-small" id="btnAddVehicle">+ Agregar</button>
          </div>
          <ul class="vehicle-list" id="vehicleList"></ul>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>Zonas geocercadas</h2>
            <button class="btn btn-small" id="btnDrawFence">Dibujar zona</button>
          </div>
          <ul class="fence-list" id="fenceList"></ul>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>Historial de ruta</h2>
          </div>
          <div class="history-controls">
            <select id="historyVehicleSelect"></select>
            <button class="btn btn-small" id="btnLoadHistory">Ver recorrido</button>
            <button class="btn btn-small btn-ghost" id="btnClearHistory">Limpiar</button>
          </div>
          <div class="history-player" id="historyPlayer" hidden>
            <input type="range" id="historySlider" min="0" max="0" value="0" />
            <div class="history-actions">
              <button class="btn btn-small" id="btnPlayHistory">▶ Reproducir</button>
              <span id="historyTimestamp"></span>
            </div>
          </div>
        </section>
      </aside>

      <main class="map-wrap">
        <div id="map"></div>
      </main>

      <aside class="alerts-panel">
        <div class="panel-header">
          <h2>Alertas recientes</h2>
        </div>
        <ul class="alert-list" id="alertList"></ul>
      </aside>
    </div>
  </div>

  <dialog id="vehicleDialog">
    <form id="vehicleForm" method="dialog">
      <h3>Nuevo vehículo</h3>
      <label>Patente <input name="plate" required placeholder="AB123CD" /></label>
      <label>Nombre / apodo <input name="label" required placeholder="Camioneta 1" /></label>
      <label>Conductor <input name="driverName" placeholder="Juan Pérez" /></label>
      <label>Tipo
        <select name="type">
          <option value="van">Furgón</option>
          <option value="truck">Camión</option>
          <option value="car">Auto</option>
          <option value="motorcycle">Moto</option>
        </select>
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" id="btnCancelVehicle">Cancelar</button>
        <button type="submit" class="btn">Crear</button>
      </div>
    </form>
  </dialog>

  <dialog id="fenceDialog">
    <form id="fenceForm" method="dialog">
      <h3>Nueva zona geocercada</h3>
      <p class="hint">Hacé click en el mapa para elegir el centro, luego completá los datos.</p>
      <label>Nombre <input name="name" required placeholder="Depósito central" /></label>
      <label>Radio (metros) <input name="radiusM" type="number" required value="300" min="20" /></label>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" id="btnCancelFence">Cancelar</button>
        <button type="submit" class="btn">Crear zona</button>
      </div>
    </form>
  </dialog>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
